# Genesis energy bolts. Inherit current upstream projectile fixtures and audio.
- type: entity
  parent: BulletLaser
  id: BulletEnergyGunLaser
  name: energy bolt
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
