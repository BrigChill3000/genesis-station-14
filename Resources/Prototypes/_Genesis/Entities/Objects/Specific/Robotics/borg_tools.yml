- type: entity
  name: epinephrine robot hypospray
  parent: BorgHypo
  description: A borg version of hypospray that automatically regenerates epinephrine.
  id: HyposprayBorgStandard
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      maxVol: 15
  - type: SolutionRegeneration
    solution: hypospray
    generated:
      reagents:
      - ReagentId: Epinephrine
        Quantity: 0.1
  - type: Injector
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode

- type: entity
  name: proto-kinetic robot accelerator
  id: WeaponProtoKineticAcceleratorBorg
  parent: WeaponProtoKineticAcceleratorBase
  description: Fires low-damage kinetic bolts at a short range.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    layers:
    - state: icon
    - state: animation-icon
      visible: false
      map: [ "empty-icon" ]
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    angleDecay: 45
    minAngle: 2
    maxAngle: 2
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg

- type: entity
  name: borg crowbar
  parent: Crowbar
  id: CrowbarBorg
  categories: [ HideSpawnMenu ]

- type: entity
  id: FireExtinguisherBorg
  name: fire extinguisher borg
  description: fire extinguisher borg
  parent: FireExtinguisher
  categories: [ HideSpawnMenu ]
  components:
    - type: SolutionRegeneration
      solution: spray
      generated:
        reagents:
        - ReagentId: Water
          Quantity: 2
